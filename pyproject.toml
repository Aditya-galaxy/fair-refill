[project]
name = "fair-refill"
version = "0.1.0"
description = "Alexa+ add-on: are you overpaying for a prescription? Compares the identical drug against live CMS, Cost Plus and Medicare prices."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=2.2,<3", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
video = ["websockets>=13"]          # video/capture.py drives Chrome over its DevTools protocol

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"video/*" = ["S603", "S607"]   # the film pipeline runs ffmpeg, say and Chrome with fixed arguments

# Named explicitly: the local cache/ and state/ folders sit beside the package,
# and setuptools refuses to guess between them.
[tool.setuptools]
packages = ["fair_refill"]

[tool.setuptools.package-data]
fair_refill = ["card.html", "simulator.html"]
