<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fair Refill</title>
<!--
  The card an Alexa+ device with a screen shows beside the spoken answer.

  Built to Amazon's add-on design guide: one title, one or two details, one
  action, and type sized to be read from across a room (the guide's 1.6 scale).
  Everything on it is also in the spoken answer; the card never carries
  information a person without a screen would miss.

  It is an MCP App (ui:// resource). A host delivers the tool result with the
  ui/notifications/tool-result notification; the simulator in this repo also
  posts {type: "fair-refill", data}. Opened directly with #<json>, it renders
  that — which is how the screenshots are made.
-->
<style>
  /* One unit that scales with the screen the card is on, so the same card
     reads the same on an 8-inch and a 15-inch display. Sizes keep the design
     guide's far-field ratios: title about 1.6x the details, details about
     1.6x the small print. */
  :root {
    --bg: #0f1a24; --panel: #16263a; --ink: #f4f7fa; --soft: #a9b8c6;
    --accent: #7fd1c7; --warn: #ffcf7a;
    --u: min(1vw, 1.6vh);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 calc(var(--u) * 2.4)/1.3 "Amazon Ember", -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: calc(var(--u) * 3);
  }
  .card { width: 100%; max-height: 100%; background: var(--panel); border-radius: calc(var(--u) * 2.4);
          padding: calc(var(--u) * 4) calc(var(--u) * 5); }
  .brand { color: var(--accent); font-weight: 600; letter-spacing: .02em;
           font-size: max(11px, calc(var(--u) * 2.1)); margin-bottom: calc(var(--u) * 1.4); }
  h1 { margin: 0 0 calc(var(--u) * 2.2); font-weight: 650; letter-spacing: -.01em;
       font-size: max(18px, calc(var(--u) * 6.2)); line-height: 1.08; }
  .details { list-style: none; margin: 0 0 calc(var(--u) * 3); padding: 0; }
  .details li { font-size: max(14px, calc(var(--u) * 3.9)); margin: calc(var(--u) * .8) 0; }
  .details li:first-child { color: var(--warn); }
  .action { display: inline-block; border-radius: 999px; padding: calc(var(--u) * 1.3) calc(var(--u) * 2.8);
            background: var(--accent); color: #062521; font-weight: 650;
            font-size: max(12px, calc(var(--u) * 2.8)); }
  .sources { margin-top: calc(var(--u) * 2.6); color: var(--soft); font-size: max(10px, calc(var(--u) * 1.6)); }
  .empty { color: var(--soft); font-size: max(14px, calc(var(--u) * 3.2)); text-align: center; }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="empty">Ask about a prescription to see its price here.</div>
  </main>
<script>
  const card = document.getElementById("card");

  function text(tag, value, cls) {
    const el = document.createElement(tag);
    el.textContent = value;          // never innerHTML: this text comes from price sources
    if (cls) el.className = cls;
    return el;
  }

  function render(data) {
    const c = data && data.card;
    card.replaceChildren();
    card.append(text("div", "Fair Refill", "brand"));
    if (!c) {
      card.append(text("h1", data && data.speech ? data.speech : "Ask about a prescription."));
      return;
    }
    card.append(text("h1", c.title));
    const list = document.createElement("ul");
    list.className = "details";
    (c.details || []).slice(0, 2).forEach((d) => list.append(text("li", d)));
    card.append(list);
    if (c.action) card.append(text("span", c.action, "action"));
    if (c.sources && c.sources.length) card.append(text("div", "Sources: " + c.sources.join(" · "), "sources"));
  }

  window.addEventListener("message", (event) => {
    const m = event.data || {};
    if (m.method === "ui/notifications/tool-result" && m.params) {
      render(m.params.structuredContent || m.params);
    } else if (m.type === "fair-refill") {
      render(m.data);
    }
  });

  if (location.hash.length > 1) {
    try { render(JSON.parse(decodeURIComponent(location.hash.slice(1)))); } catch (_) {}
  }
</script>
</body>
</html>
